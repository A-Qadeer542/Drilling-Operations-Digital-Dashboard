version: "3.9"
services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAPHQL_HTTP: http://backend:4000/graphql
        VITE_GRAPHQL_WS: ws://backend:4000/graphql
    depends_on:
      - backend
    ports:
      - "4173:4173"

